<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Наша история — Кучерявые свидания</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Geologica:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--black:#0f0f0f;--white:#fafaf8;--cream:#f4f1ec;--muted:#999;--border:rgba(15,15,15,.1);--font-display:'Cormorant Garamond',serif;--font-body:'Geologica',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-body);background:var(--white);color:var(--black);min-height:100vh}
.header{padding:24px 16px 20px;max-width:800px;margin:0 auto;display:flex;align-items:center;gap:16px;border-bottom:1px solid var(--border)}
.back{color:var(--black);font-size:22px;opacity:.5;line-height:1;text-decoration:none;flex-shrink:0}
.header-text h1{font-family:var(--font-display);font-size:26px;font-weight:500}
.header-text p{font-size:11px;color:var(--muted);margin-top:3px;font-weight:300;letter-spacing:.03em}
.sync-bar{padding:8px 16px;max-width:800px;margin:0 auto;display:flex;align-items:center;gap:6px;font-size:10px;color:var(--muted)}
.sync-dot{width:5px;height:5px;border-radius:50%;background:#22c55e;flex-shrink:0}
.sync-dot.syncing{background:#f59e0b;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.content{max-width:800px;margin:0 auto;padding:0 16px 48px}
.empty{text-align:center;padding:4rem 1rem;color:var(--muted);font-size:13px;font-weight:300}
.hist-item{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--border);cursor:pointer;transition:opacity .2s}
.hist-item:hover{opacity:.75}
.hist-item:last-child{border-bottom:none}
.hist-thumb{width:100px;height:100px;flex-shrink:0;overflow:hidden;background:var(--cream)}
.hist-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.hist-thumb-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:32px}
.hist-right{flex:1;padding-top:2px}
.hist-date{font-size:9px;color:var(--muted);letter-spacing:.07em;text-transform:uppercase;margin-bottom:4px}
.hist-title{font-family:var(--font-display);font-size:20px;font-weight:500;margin-bottom:4px;line-height:1.2}
.hist-cat{font-size:10px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:5px}
.hist-stars{font-size:14px;color:#FDD663;letter-spacing:-1px;margin-bottom:5px}
.hist-review{font-size:12px;color:#555;line-height:1.5;font-weight:300;margin-bottom:8px}
.hist-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn-repeat{padding:7px 14px;background:var(--black);color:#fff;border:none;font-family:var(--font-body);font-size:11px;cursor:pointer;letter-spacing:.06em}
.btn-repeat:hover{opacity:.8}
.btn-open{padding:7px 14px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:var(--font-body);font-size:11px;cursor:pointer;letter-spacing:.06em}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:flex-end;justify-content:center}
.modal-bg.show{display:flex}
@media(min-width:600px){.modal-bg{align-items:center}}
.plan-modal{background:var(--white);width:100%;max-width:360px;padding:28px 20px;margin:16px}
.plan-modal h3{font-family:var(--font-display);font-size:20px;font-weight:500;margin-bottom:6px}
.plan-modal p{font-size:12px;color:var(--muted);margin-bottom:20px;font-weight:300;line-height:1.5}
.plan-date-input{width:100%;font-size:13px;font-family:var(--font-body);padding:10px 12px;border:1px solid var(--border);background:var(--cream);color:var(--black);outline:none;margin-bottom:10px;display:none;-webkit-appearance:none}
.plan-btns{display:flex;flex-direction:column;gap:8px}
.btn-plan-confirm{padding:11px;background:var(--black);color:#fff;border:none;font-family:var(--font-body);font-size:12px;cursor:pointer;letter-spacing:.06em;text-align:left}
.btn-plan-later{padding:11px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:var(--font-body);font-size:12px;cursor:pointer;letter-spacing:.06em;text-align:left}
.btn-cancel-form{padding:11px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:var(--font-body);font-size:12px;cursor:pointer}
</style>
</head>
<body>
<div class="header">
  <a class="back" href="index.html">←</a>
  <div class="header-text">
    <h1>Наша история</h1>
    <p>Все свидания — от новых к старым</p>
  </div>
</div>
<div class="sync-bar">
  <div class="sync-dot syncing" id="sync-dot"></div>
  <span id="sync-text">Загрузка...</span>
</div>
<div class="content" id="content"><div class="empty">Загрузка...</div></div>
<div class="modal-bg" id="plan-modal">
  <div class="plan-modal">
    <h3>Запланировать повторно</h3>
    <p>Выберите дату или добавьте в план — определитесь позже</p>
    <input type="hidden" id="plan-id">
    <input type="date" class="plan-date-input" id="plan-date-input">
    <div class="plan-btns">
      <button class="btn-plan-confirm" onclick="togglePlanDate()">📅 Выбрать дату</button>
      <button class="btn-plan-later" onclick="planWithoutDate()">Добавить в план, дату выберем позже</button>
      <button class="btn-cancel-form" onclick="closeModal()" style="margin-top:4px">Отмена</button>
    </div>
  </div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
const app=initializeApp({databaseURL:"https://curly-dates-default-rtdb.europe-west1.firebasedatabase.app/"});
const db=getDatabase(app);
const catMeta={active:{label:'Активное',emoji:'🎯'},trip:{label:'Поездка',emoji:'✈️'},food:{label:'Ресторан',emoji:'🍽️'},sport:{label:'Спорт',emoji:'⚡'},culture:{label:'Культура',emoji:'🎭'},spa:{label:'Спа',emoji:'🛁'}};
let ideas=[];
function setSyncStatus(s,t){document.getElementById('sync-dot').className='sync-dot'+(s==='syncing'?' syncing':'');document.getElementById('sync-text').textContent=t;}
function parseDate(str){if(!str)return null;const[y,m,d]=str.split('-');return new Date(+y,+m-1,+d);}
function formatDate(str,opts){const d=parseDate(str);return d?d.toLocaleDateString('ru',opts):'';}
onValue(ref(db,'ideas'),snap=>{
  const data=snap.val();
  ideas=data?Object.values(data).filter(d=>d.done&&d.date&&!d.deleted).sort((a,b)=>parseDate(b.date)-parseDate(a.date)):[];
  setSyncStatus('ok','Синхронизировано');render();
},err=>setSyncStatus('error',err.message));
function render(){
  const el=document.getElementById('content');
  if(!ideas.length){el.innerHTML='<div class="empty">Пока не было ни одного свидания — всё впереди ✨</div>';return;}
  el.innerHTML=ideas.map(d=>{
    const m=catMeta[d.cat]||catMeta.active;
    const stars=d.rating?'★'.repeat(d.rating)+'☆'.repeat(5-d.rating):'';
    const dateStr=formatDate(d.date,{day:'numeric',month:'long',year:'numeric'});
    const times=(d.dates||[]).length;
    return`<div class="hist-item" onclick="window.location.href='idea.html?id=${d.id}'">
      <div class="hist-thumb">${d.img?`<img src="${d.img}" alt="${d.title}" loading="lazy" onerror="this.outerHTML='<div class=hist-thumb-ph>${m.emoji}</div>'">`:`<div class="hist-thumb-ph">${m.emoji}</div>`}</div>
      <div class="hist-right">
        <div class="hist-date">${dateStr}${times>1?' · были ×'+times:''}</div>
        <div class="hist-title">${d.title}</div>
        <div class="hist-cat">${m.label}</div>
        ${stars?`<div class="hist-stars">${stars}</div>`:''}
        ${d.review?`<div class="hist-review">${d.review}</div>`:''}
        <div class="hist-actions">
          <button class="btn-repeat" onclick="event.stopPropagation();openPlan('${d.id}')">Повторить</button>
          <button class="btn-open" onclick="event.stopPropagation();window.location.href='idea.html?id=${d.id}'">Открыть →</button>
        </div>
      </div>
    </div>`;
  }).join('');
}
window.openPlan=async id=>{await update(ref(db,'ideas/'+id),{repeat:true});};
window.togglePlanDate=()=>{const inp=document.getElementById('plan-date-input');inp.style.display=inp.style.display==='none'?'block':'none';if(inp.style.display==='block'){inp.focus();inp.onchange=async()=>{const id=document.getElementById('plan-id').value;await update(ref(db,'ideas/'+id),{planned:true,plannedDate:inp.value,repeat:true});closeModal();};}};
window.planWithoutDate=async()=>{const id=document.getElementById('plan-id').value;await update(ref(db,'ideas/'+id),{planned:true,plannedDate:'',repeat:true});closeModal();};
window.closeModal=()=>document.getElementById('plan-modal').classList.remove('show');
document.getElementById('plan-modal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal();});
</script>
</body>
</html>
