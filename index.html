<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Кучерявые свидания</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Geologica:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--black:#0f0f0f;--white:#fafaf8;--cream:#f4f1ec;--muted:#999;--border:rgba(15,15,15,.1);--font-display:'Cormorant Garamond',serif;--font-body:'Geologica',sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--font-body);background:var(--white);color:var(--black);min-height:100vh}
a{text-decoration:none;color:inherit}

/* HEADER */
.header{padding:24px 16px 0;max-width:800px;margin:0 auto}
.header-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:6px}
.site-title{font-family:var(--font-display);font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1}
.site-sub{font-size:11px;color:var(--muted);letter-spacing:.04em;margin-bottom:0;font-weight:300}

/* BURGER */
.burger{position:relative}
.burger-btn{width:36px;height:36px;background:transparent;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:0}
.burger-line{width:20px;height:1.5px;background:var(--black);border-radius:1px;display:block}
.burger-menu{position:absolute;top:42px;right:0;background:var(--white);border:1px solid var(--border);min-width:170px;z-index:100;box-shadow:0 4px 20px rgba(0,0,0,.08);display:none}
.burger-menu.open{display:block}
.burger-item{display:flex;align-items:center;gap:10px;padding:12px 16px;font-size:12px;color:var(--black);cursor:pointer;border-bottom:1px solid var(--border);font-family:var(--font-body);letter-spacing:.03em;text-decoration:none}
.burger-item:last-child{border-bottom:none}
.burger-item:hover{background:var(--cream)}
.burger-item svg{width:14px;height:14px;stroke:currentColor;stroke-width:1.5;fill:none;opacity:.6;flex-shrink:0}

/* HERO BLOCK — next or last date */
.hero-block{margin:24px 16px 0;max-width:calc(800px - 32px);margin-left:auto;margin-right:auto}
.hero-inner{display:flex;gap:16px;align-items:flex-start}
.hero-thumb{width:180px;height:180px;flex-shrink:0;overflow:hidden;background:var(--cream)}
.hero-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.hero-thumb-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:48px}
.hero-info{flex:1;padding-top:2px}
.hero-eyebrow{font-size:9px;color:var(--muted);letter-spacing:.09em;text-transform:uppercase;margin-bottom:8px;font-family:var(--font-body)}
.hero-date{font-family:var(--font-display);font-size:26px;font-weight:500;letter-spacing:-.02em;line-height:1;margin-bottom:6px}
.hero-date.muted{font-size:18px;color:var(--muted);font-weight:400}
.hero-place{font-size:13px;color:#555;font-weight:300;margin-bottom:14px;line-height:1.45}
.hero-link{font-size:11px;color:var(--black);letter-spacing:.04em;border-bottom:1px solid rgba(0,0,0,.25);display:inline-block;cursor:pointer;padding-bottom:1px;font-family:var(--font-body)}
.hero-choose{font-size:11px;color:var(--black);letter-spacing:.04em;border-bottom:1px solid rgba(0,0,0,.25);display:inline-flex;align-items:center;gap:5px;cursor:pointer;padding-bottom:1px;font-family:var(--font-body)}
.hero-choose svg{width:12px;height:12px;stroke:var(--black);stroke-width:1.8;fill:none}
.hero-date-input{font-size:11px;font-family:var(--font-body);padding:4px 8px;border:1px solid var(--border);background:var(--cream);color:var(--black);outline:none;margin-top:6px;display:none}

/* NUDGE */
.nudge{background:#edf5ef;border-left:2px solid #a8d4b0;padding:12px 16px;margin-top:16px;display:none}
.nudge p{font-size:12px;color:#3a6644;font-weight:300;line-height:1.55;font-style:italic;font-family:var(--font-body)}

/* ADD BTN */
.add-top-wrap{padding:20px 16px 0;max-width:800px;margin:0 auto}
.add-top-btn{display:flex;align-items:center;gap:8px;padding:12px 16px;background:var(--black);color:var(--white);font-family:var(--font-body);font-size:12px;font-weight:400;letter-spacing:.08em;text-transform:uppercase;border:none;cursor:pointer;width:100%;justify-content:center;transition:opacity .2s}
.add-top-btn:hover{opacity:.85}
.add-top-btn svg{width:14px;height:14px;stroke:#fff;stroke-width:2;fill:none}

/* FILTERS */
.filters-wrap{padding:20px 16px 0;max-width:800px;margin:0 auto}
.filters{display:flex;gap:0;overflow-x:auto;border-bottom:1px solid var(--border)}
.filters::-webkit-scrollbar{display:none}
.fc{padding:10px 14px;border-bottom:2px solid transparent;background:transparent;color:var(--muted);font-size:11px;font-family:var(--font-body);white-space:nowrap;cursor:pointer;margin-bottom:-1px;letter-spacing:.04em;font-weight:400;border-top:none;border-left:none;border-right:none;transition:all .2s}
.fc.on{color:var(--black);border-bottom-color:var(--black);font-weight:500}
.fc:hover:not(.on){color:var(--black)}

/* GRID */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:2px;max-width:800px;margin:2px auto 0}
@media(min-width:600px){.grid{grid-template-columns:1fr 1fr 1fr}}

/* CARD */
.card{position:relative;overflow:hidden;cursor:pointer;background:#e8e5e0;aspect-ratio:2/3}
.card-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .4s ease}
.card:hover .card-img{transform:scale(1.03)}
.card-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.58) 0%,rgba(0,0,0,.08) 52%,transparent 72%)}
.card-emoji{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:52px}

/* Icons — pure SVG no borders */
.ic{position:absolute;background:none;border:none;outline:none;box-shadow:none;-webkit-appearance:none;appearance:none;padding:0;margin:0;cursor:pointer;line-height:0;filter:drop-shadow(0 1px 3px rgba(0,0,0,.6))}
.ic-heart{top:10px;right:10px}
.ic-del{top:10px;left:10px}
.ic-edit{top:34px;left:10px}

.card-info{position:absolute;bottom:0;left:0;right:0;padding:10px 10px 12px;z-index:1}
.card-cat{font-size:9px;color:rgba(255,255,255,.6);letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px;font-weight:400}
.card-title{font-family:var(--font-display);font-size:16px;font-weight:500;color:#fff;line-height:1.2;margin-bottom:3px}
.card-desc{font-size:10px;color:rgba(255,255,255,.7);line-height:1.4;font-weight:300}
.card-done-badge{display:inline-block;font-size:9px;color:rgba(255,255,255,.85);background:rgba(255,255,255,.15);padding:2px 7px;margin-top:5px;letter-spacing:.06em;text-transform:uppercase}

/* PLAN BTN on card */
.c-plan-btn{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.35);font-size:9px;color:#fff;font-family:var(--font-body);letter-spacing:.04em;cursor:pointer;margin-top:5px;backdrop-filter:blur(4px)}
.c-plan-btn svg{width:11px;height:11px;stroke:#fff;stroke-width:1.8;fill:none;flex-shrink:0}
.c-planned-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;background:rgba(255,255,255,.92);font-size:9px;color:var(--black);font-family:var(--font-body);letter-spacing:.04em;margin-top:5px}
.c-planned-badge svg{width:11px;height:11px;stroke:var(--black);stroke-width:1.8;fill:none;flex-shrink:0}
.c-plan-date-link{display:inline-block;margin-top:3px;font-size:9px;color:rgba(255,255,255,.7);font-family:var(--font-body);border-bottom:1px solid rgba(255,255,255,.3);cursor:pointer;letter-spacing:.04em}

/* EMPTY */
.empty{grid-column:1/-1;text-align:center;padding:3rem 1rem;color:var(--muted);font-size:13px;font-weight:300}

/* BOTTOM ADD */
.add-bottom-wrap{padding:20px 16px;max-width:800px;margin:0 auto}
.add-bottom-btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:var(--font-body);font-size:12px;cursor:pointer;width:100%;letter-spacing:.06em;transition:all .2s}
.add-bottom-btn:hover{border-color:var(--black);color:var(--black)}

/* HISTORY PREVIEW */
.hist-section{max-width:800px;margin:0 auto;padding:0 16px 32px;border-top:1px solid var(--border);margin-top:8px}
.hist-head{display:flex;align-items:center;justify-content:space-between;padding:20px 0 16px}
.hist-head span{font-family:var(--font-display);font-size:20px;font-weight:500}
.hist-head a{font-size:11px;color:var(--muted);letter-spacing:.04em}
.hist-grid{display:grid;grid-template-columns:1fr 1fr;gap:2px}
@media(min-width:600px){.hist-grid{grid-template-columns:1fr 1fr 1fr}}
.hcard{position:relative;overflow:hidden;background:#e5e1db;aspect-ratio:3/4;cursor:pointer}
.hcard-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.hcard-grad{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.78) 0%,rgba(0,0,0,.1) 55%,transparent 75%)}
.hcard-info{position:absolute;bottom:0;left:0;right:0;padding:10px}
.hcard-date{font-size:9px;color:rgba(255,255,255,.55);letter-spacing:.07em;text-transform:uppercase;margin-bottom:3px;font-family:var(--font-body)}
.hcard-title{font-family:var(--font-display);font-size:15px;font-weight:500;color:#fff;line-height:1.2;margin-bottom:4px}
.hcard-stars{font-size:13px;color:#FDD663;letter-spacing:-1px;margin-bottom:3px}
.hcard-review{font-size:10px;color:rgba(255,255,255,.75);line-height:1.4;font-family:var(--font-body);font-weight:300;margin-bottom:6px}
.hcard-repeat{font-size:9px;color:rgba(255,255,255,.7);font-family:var(--font-body);letter-spacing:.05em;border-bottom:1px solid rgba(255,255,255,.3);display:inline-block;cursor:pointer;padding-bottom:1px}

/* SYNC */
.sync-bar{padding:8px 16px;max-width:800px;margin:0 auto;display:flex;align-items:center;gap:6px;font-size:10px;color:var(--muted);letter-spacing:.04em}
.sync-dot{width:5px;height:5px;border-radius:50%;background:#22c55e;flex-shrink:0}
.sync-dot.syncing{background:#f59e0b;animation:pulse 1s infinite}
.sync-dot.error{background:#ef4444}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* MODALS */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:flex-end;justify-content:center}
.modal-bg.show{display:flex}
@media(min-width:600px){.modal-bg{align-items:center}}
.modal{background:var(--white);width:100%;max-width:480px;padding:28px 20px;max-height:90vh;overflow-y:auto}
.modal h3{font-family:var(--font-display);font-size:22px;font-weight:500;margin-bottom:22px}
.form-row{margin-bottom:14px}
.form-row label{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:5px;font-weight:400}
.form-row input,.form-row textarea,.form-row select{width:100%;font-size:13px;font-family:var(--font-body);padding:10px 12px;border:1px solid var(--border);background:var(--cream);color:var(--black);outline:none;-webkit-appearance:none;border-radius:0}
.form-row input:focus,.form-row textarea:focus,.form-row select:focus{border-color:var(--black)}
.form-row textarea{height:64px;resize:none}
.form-btns{display:flex;gap:8px;margin-top:20px}
.btn-save{flex:1;padding:12px;background:var(--black);color:var(--white);font-family:var(--font-body);font-size:12px;letter-spacing:.08em;text-transform:uppercase;border:none;cursor:pointer;transition:opacity .2s}
.btn-save:hover{opacity:.85}
.btn-cancel-form{padding:12px 20px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:var(--font-body);font-size:12px;cursor:pointer}

/* PLAN MODAL */
.plan-modal{background:var(--white);width:100%;max-width:360px;padding:28px 20px;margin:16px}
.plan-modal h3{font-family:var(--font-display);font-size:20px;font-weight:500;margin-bottom:6px}
.plan-modal p{font-size:12px;color:var(--muted);margin-bottom:20px;font-weight:300;line-height:1.5}
.plan-btns{display:flex;flex-direction:column;gap:8px}
.btn-plan-date{padding:11px;background:var(--black);color:var(--white);border:none;font-family:var(--font-body);font-size:12px;cursor:pointer;letter-spacing:.06em;text-align:left}
.btn-plan-later{padding:11px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:var(--font-body);font-size:12px;cursor:pointer;letter-spacing:.06em;text-align:left}
.plan-date-input{width:100%;font-size:13px;font-family:var(--font-body);padding:10px 12px;border:1px solid var(--border);background:var(--cream);color:var(--black);outline:none;margin-bottom:10px;display:none}

/* CONFIRM */
.confirm-modal{background:var(--white);width:100%;max-width:360px;padding:28px 20px;margin:16px}
.confirm-modal p{font-size:14px;color:var(--black);margin-bottom:22px;line-height:1.5;font-weight:300}
.confirm-btns{display:flex;gap:8px}
.btn-confirm-del{flex:1;padding:11px;background:var(--black);color:var(--white);font-family:var(--font-body);font-size:12px;border:none;cursor:pointer;letter-spacing:.06em}
.btn-confirm-cancel{flex:1;padding:11px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:var(--font-body);font-size:12px;cursor:pointer}

@media(max-width:480px){
  .hero-thumb{width:140px;height:140px}
  .site-title{font-size:22px}
}
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div>
      <div class="site-title">Кучерявые свидания</div>
      <div class="site-sub">Чтобы нам было легко, просто и с любовью</div>
    </div>
    <div class="burger">
      <button class="burger-btn" onclick="toggleBurger()">
        <span class="burger-line"></span>
        <span class="burger-line"></span>
        <span class="burger-line"></span>
      </button>
      <div class="burger-menu" id="burger-menu">
        <a class="burger-item" href="history.html">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          Наша история
        </a>
        <a class="burger-item" href="deleted.html">
          <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M9 6V4h6v2"/></svg>
          Удалённые
        </a>
      </div>
    </div>
  </div>
</div>

<div class="sync-bar">
  <div class="sync-dot syncing" id="sync-dot"></div>
  <span id="sync-text">Подключаемся...</span>
</div>

<!-- HERO: next planned or last date -->
<div class="hero-block" id="hero-block" style="display:none">
  <div class="hero-inner">
    <div class="hero-thumb" id="hero-thumb">
      <div class="hero-thumb-ph" id="hero-thumb-ph"></div>
    </div>
    <div class="hero-info">
      <div class="hero-eyebrow" id="hero-eyebrow"></div>
      <div class="hero-date" id="hero-date"></div>
      <div class="hero-place" id="hero-place"></div>
      <div id="hero-action"></div>
    </div>
  </div>
  <div class="nudge" id="nudge">
    <p id="nudge-text"></p>
  </div>
</div>

<div class="add-top-wrap">
  <button class="add-top-btn" onclick="openAddModal()">
    <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    Добавить идею
  </button>
</div>

<div class="filters-wrap">
  <div class="filters" id="filters">
    <button class="fc on" onclick="setFilter('all',this)">Все</button>
    <button class="fc" onclick="setFilter('liked',this)">Нравится</button>
    <button class="fc" onclick="setFilter('trip',this)">Поездки</button>
    <button class="fc" onclick="setFilter('sport',this)">Спорт</button>
    <button class="fc" onclick="setFilter('food',this)">Рестораны</button>
    <button class="fc" onclick="setFilter('spa',this)">Спа</button>
    <button class="fc" onclick="setFilter('culture',this)">Культура</button>
    <button class="fc" onclick="setFilter('active',this)">Активное</button>
  </div>
</div>

<div class="grid" id="grid"></div>

<div class="add-bottom-wrap">
  <button class="add-bottom-btn" onclick="openAddModal()">+ Добавить свою идею</button>
</div>

<!-- HISTORY PREVIEW -->
<div class="hist-section" id="hist-section" style="display:none">
  <div class="hist-head">
    <span>Наша история</span>
    <a href="history.html">Все →</a>
  </div>
  <div class="hist-grid" id="hist-grid"></div>
</div>

<!-- ADD/EDIT MODAL -->
<div class="modal-bg" id="add-modal">
  <div class="modal">
    <h3 id="modal-title">Новая идея</h3>
    <input type="hidden" id="edit-id">
    <div class="form-row"><label>Название</label><input type="text" id="f-title" placeholder="Название свидания"></div>
    <div class="form-row"><label>Описание</label><textarea id="f-desc" placeholder="Пара слов о формате..."></textarea></div>
    <div class="form-row"><label>Категория</label>
      <select id="f-cat">
        <option value="active">Активное</option>
        <option value="trip">Поездка</option>
        <option value="food">Ресторан</option>
        <option value="sport">Спорт</option>
        <option value="culture">Культура</option>
        <option value="spa">Спа / Релакс</option>
      </select>
    </div>
    <div class="form-row"><label>Ссылка на фото (URL)</label><input type="text" id="f-img" placeholder="https://..."></div>
    <div class="form-row"><label>Адрес</label><input type="text" id="f-addr" placeholder="Москва, ул. ..."></div>
    <div class="form-row"><label>Сайт</label><input type="text" id="f-link" placeholder="https://..."></div>
    <div class="form-btns">
      <button class="btn-save" onclick="saveIdea()">Сохранить</button>
      <button class="btn-cancel-form" onclick="closeModal('add-modal')">Отмена</button>
    </div>
  </div>
</div>

<!-- PLAN MODAL -->
<div class="modal-bg" id="plan-modal">
  <div class="plan-modal">
    <h3>Запланировать</h3>
    <p>Выберите дату или добавьте в план без даты — определитесь позже</p>
    <input type="hidden" id="plan-id">
    <input type="date" class="plan-date-input" id="plan-date-input">
    <div class="plan-btns">
      <button class="btn-plan-date" onclick="togglePlanDate()">📅 Выбрать дату</button>
      <button class="btn-plan-later" onclick="planWithoutDate()">Добавить в план, дату выберем позже</button>
      <button class="btn-cancel-form" onclick="closeModal('plan-modal')" style="margin-top:4px">Отмена</button>
    </div>
  </div>
</div>

<!-- CONFIRM DELETE -->
<div class="modal-bg" id="confirm-modal">
  <div class="confirm-modal">
    <p>Удалить эту идею? Она попадёт в список удалённых.</p>
    <div class="confirm-btns">
      <button class="btn-confirm-del" onclick="confirmDelete()">Удалить</button>
      <button class="btn-confirm-cancel" onclick="closeModal('confirm-modal')">Отмена</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, onValue, update } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const app = initializeApp({ databaseURL: "https://curly-dates-default-rtdb.europe-west1.firebasedatabase.app/" });
const db = getDatabase(app);
const ideasRef = ref(db, 'ideas');

const catMeta = {
  active:{label:'Активное',emoji:'🎯'}, trip:{label:'Поездка',emoji:'✈️'},
  food:{label:'Ресторан',emoji:'🍽️'}, sport:{label:'Спорт',emoji:'⚡'},
  culture:{label:'Культура',emoji:'🎭'}, spa:{label:'Спа',emoji:'🛁'},
};

const SEED = [

let ideas=[], filter='all', pendingDeleteId=null, initialized=false;

const urlParams=new URLSearchParams(window.location.search);
const urlFilter=urlParams.get('filter');
if(urlFilter){filter=urlFilter;document.querySelectorAll('.fc').forEach(b=>{b.classList.remove('on');if(b.getAttribute('onclick')&&b.getAttribute('onclick').includes("'"+urlFilter+"'"))b.classList.add('on');});}

function setSyncStatus(s,t){document.getElementById('sync-dot').className='sync-dot'+(s==='syncing'?' syncing':s==='error'?' error':'');document.getElementById('sync-text').textContent=t;}

onValue(ideasRef,snap=>{
  const data=snap.val();
  if(data){ideas=Object.values(data).sort((a,b)=>Number(a.id)-Number(b.id));setSyncStatus('ok','Синхронизировано · '+new Date().toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'}));}
  else if(!initialized){const obj={};SEED.forEach(s=>obj[s.id]=s);set(ideasRef,obj);}
  initialized=true;
  render();renderHero();renderHistPreview();
},err=>setSyncStatus('error',err.message));

async function patch(id,data){setSyncStatus('syncing','Сохраняем...');await update(ref(db,'ideas/'+id),data);}

function renderHero(){
  const block=document.getElementById('hero-block');
  const m=catMeta;
  // Find next planned
  const planned=ideas.filter(d=>d.planned&&!d.deleted&&!d.done);
  const withDate=planned.filter(d=>d.plannedDate).sort((a,b)=>new Date(a.plannedDate)-new Date(b.plannedDate));
  const withoutDate=planned.filter(d=>!d.plannedDate);
  const next=withDate[0]||withoutDate[0];

  if(next){
    block.style.display='block';
    const meta=m[next.cat]||m.active;
    document.getElementById('hero-eyebrow').textContent='Следующее свидание';
    if(next.img){document.getElementById('hero-thumb').innerHTML=`<img src="${next.img}" alt="${next.title}" onerror="this.outerHTML='<div class=hero-thumb-ph>${meta.emoji}</div>'">`;}
    else{document.getElementById('hero-thumb-ph').textContent=meta.emoji;}
    if(next.plannedDate){
      const d=new Date(next.plannedDate);
      document.getElementById('hero-date').textContent=d.toLocaleDateString('ru',{day:'numeric',month:'long'});
      document.getElementById('hero-date').className='hero-date';
    } else {
      document.getElementById('hero-date').textContent='Дата не выбрана';
      document.getElementById('hero-date').className='hero-date muted';
    }
    document.getElementById('hero-place').textContent=next.title;
    document.getElementById('hero-action').innerHTML=next.plannedDate
      ?`<a class="hero-link" href="idea.html?id=${next.id}">Открыть →</a>`
      :`<div class="hero-choose" onclick="openPlanDateInline('${next.id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Выбрать дату</div><input type="date" id="hero-date-input" class="hero-date-input" onchange="savePlanDate('${next.id}',this.value)" style="margin-top:8px;display:none;font-family:var(--font-body);font-size:11px;padding:6px 10px;border:1px solid var(--border);background:var(--cream);color:var(--black);outline:none;width:100%">`;
    document.getElementById('nudge').style.display='none';
  } else {
    // Show last date
    const done=ideas.filter(d=>d.done&&d.date&&!d.deleted).sort((a,b)=>new Date(b.date)-new Date(a.date));
    const last=done[0];
    if(last){
      block.style.display='block';
      const meta=m[last.cat]||m.active;
      document.getElementById('hero-eyebrow').textContent='';
      if(last.img){document.getElementById('hero-thumb').innerHTML=`<img src="${last.img}" alt="${last.title}" onerror="this.outerHTML='<div class=hero-thumb-ph>${meta.emoji}</div>'">`;}
      else{document.getElementById('hero-thumb-ph').textContent=meta.emoji;}
      const d=new Date(last.date);
      document.getElementById('hero-date').textContent=d.toLocaleDateString('ru',{day:'numeric',month:'long'});
      document.getElementById('hero-date').className='hero-date';
      document.getElementById('hero-place').textContent=last.title;
      document.getElementById('hero-action').innerHTML=`<a class="hero-link" href="idea.html?id=${last.id}">Вот как это было →</a>`;
      const days=Math.floor((Date.now()-new Date(last.date))/86400000);
      if(days>=14){
        document.getElementById('nudge').style.display='block';
        document.getElementById('nudge-text').textContent=`Это было ${days} ${days===1?'день':days<5?'дня':'дней'} назад — пора запланировать что-то приятное`;
      } else {document.getElementById('nudge').style.display='none';}
    } else {block.style.display='none';}
  }
}

function getFiltered(){
  return ideas.filter(d=>{
    if(d.deleted)return false;
    if(d.done&&(d.times||0)<=1&&filter!=='done')return false;
    if(filter==='all')return true;
    if(filter==='liked')return d.liked;
    if(filter==='done')return d.done;
    return d.cat===filter;
  });
}

function svgHeart(liked){return liked?`<svg width="22" height="22" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" stroke="#e8304a" stroke-width="1.8" fill="#e8304a" stroke-linecap="round" stroke-linejoin="round"/></svg>`:`<svg width="22" height="22" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;}
function svgDel(){return`<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><polyline points="3 6 5 6 21 6" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/><path d="M19 6l-1 14H6L5 6" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 11v6M14 11v6" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/><path d="M9 6V4h6v2" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;}
function svgEdit(){return`<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;}
function svgCal(){return`<svg width="11" height="11" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="18" rx="2" stroke="currentColor" stroke-width="1.8"/><line x1="16" y1="2" x2="16" y2="6" stroke="currentColor" stroke-width="1.8"/><line x1="8" y1="2" x2="8" y2="6" stroke="currentColor" stroke-width="1.8"/><line x1="3" y1="10" x2="21" y2="10" stroke="currentColor" stroke-width="1.8"/></svg>`;}

function buildCard(d){
  const m=catMeta[d.cat]||catMeta.active;
  let planHtml='';
  if(d.planned){
    if(d.plannedDate){
      const pd=new Date(d.plannedDate);
      const dateStr=pd.toLocaleDateString('ru',{day:'numeric',month:'short'});
      planHtml=`<div class="c-planned-badge">${svgCal()} ${dateStr}</div>`;
    } else {
      planHtml=`<div class="c-planned-badge">${svgCal()} Запланировано</div><div class="c-plan-date-link" onclick="event.stopPropagation();openPlanModal('${d.id}')">Выбрать дату →</div>`;
    }
  } else if(!d.done){
    planHtml=`<div class="c-plan-btn" onclick="event.stopPropagation();openPlanModal('${d.id}')">${svgCal()} Запланировать</div>`;
  }
  return`<div class="card" onclick="goIdea('${d.id}')">
    ${d.img?`<img class="card-img" src="${d.img}" alt="${d.title}" loading="lazy" onerror="this.style.display='none'">`:''}
    ${!d.img?`<div class="card-emoji">${m.emoji}</div>`:''}
    <div class="card-overlay"></div>
    <div class="ic ic-heart" onclick="event.stopPropagation();toggleLike('${d.id}')">${svgHeart(d.liked)}</div>
    <div class="ic ic-del" onclick="event.stopPropagation();askDelete('${d.id}')">${svgDel()}</div>
    <div class="ic ic-edit" onclick="event.stopPropagation();openEditModal('${d.id}')">${svgEdit()}</div>
    <div class="card-info">
      <div class="card-cat">${m.label}</div>
      <div class="card-title">${d.title}</div>
      <div class="card-desc">${d.desc||''}</div>
      ${d.done?`<div class="card-done-badge">✓ были${(d.times||0)>1?' · ×'+d.times:''}</div>`:planHtml}
    </div>
  </div>`;
}

function render(){
  const filtered=getFiltered();
  document.getElementById('grid').innerHTML=filtered.length?filtered.map(buildCard).join(''):'<div class="empty">Нет идей в этой категории</div>';
}

function renderHistPreview(){
  const done=ideas.filter(d=>d.done&&d.date&&!d.deleted).sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,4);
  const sec=document.getElementById('hist-section');
  if(!done.length){sec.style.display='none';return;}
  sec.style.display='block';
  document.getElementById('hist-grid').innerHTML=done.map(d=>{
    const m=catMeta[d.cat]||catMeta.active;
    const stars='★'.repeat(d.rating||0)+'☆'.repeat(5-(d.rating||0));
    const dateStr=new Date(d.date).toLocaleDateString('ru',{day:'numeric',month:'short',year:'numeric'});
    return`<div class="hcard" onclick="goIdea('${d.id}')">
      ${d.img?`<img class="hcard-img" src="${d.img}" alt="${d.title}" loading="lazy" onerror="this.style.display='none'">`:''}
      <div class="hcard-grad"></div>
      <div class="hcard-info">
        <div class="hcard-date">${dateStr}</div>
        <div class="hcard-title">${d.title}</div>
        ${d.rating?`<div class="hcard-stars">${stars}</div>`:''}
        ${d.review?`<div class="hcard-review">${d.review}</div>`:''}
        <div class="hcard-repeat" onclick="event.stopPropagation();doRepeat('${d.id}')">Повторить →</div>
      </div>
    </div>`;
  }).join('');
}

window.goIdea=id=>{window.location.href=`idea.html?id=${id}`;};
window.toggleLike=async id=>{const d=ideas.find(x=>x.id===id);if(d)await patch(id,{liked:!d.liked});};
window.askDelete=id=>{pendingDeleteId=id;document.getElementById('confirm-modal').classList.add('show');};
window.confirmDelete=async()=>{if(!pendingDeleteId)return;await patch(pendingDeleteId,{deleted:true});closeModal('confirm-modal');};
window.doRepeat=async id=>{const d=ideas.find(x=>x.id===id);if(d)await patch(id,{times:(d.times||1)+1});};

window.setFilter=(f,btn)=>{
  filter=f;
  document.querySelectorAll('.fc').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  const url=new URL(window.location);
  if(f==='all')url.searchParams.delete('filter');else url.searchParams.set('filter',f);
  window.history.replaceState({},'',url);
  render();
};

window.openPlanModal=id=>{
  document.getElementById('plan-id').value=id;
  document.getElementById('plan-date-input').value='';
  document.getElementById('plan-date-input').style.display='none';
  document.getElementById('plan-modal').classList.add('show');
};

window.togglePlanDate=()=>{
  const inp=document.getElementById('plan-date-input');
  inp.style.display=inp.style.display==='none'?'block':'none';
  if(inp.style.display==='block')inp.focus();
  inp.onchange=async()=>{
    const id=document.getElementById('plan-id').value;
    await patch(id,{planned:true,plannedDate:inp.value});
    closeModal('plan-modal');
  };
};

window.planWithoutDate=async()=>{
  const id=document.getElementById('plan-id').value;
  await patch(id,{planned:true,plannedDate:''});
  closeModal('plan-modal');
};

window.openPlanDateInline=id=>{
  const inp=document.getElementById('hero-date-input');
  if(inp){inp.style.display=inp.style.display==='none'?'block':'none';}
};
window.savePlanDate=async(id,val)=>{await patch(id,{plannedDate:val});};

window.toggleBurger=()=>{document.getElementById('burger-menu').classList.toggle('open');};
document.addEventListener('click',e=>{if(!e.target.closest('.burger'))document.getElementById('burger-menu').classList.remove('open');});

window.openAddModal=()=>{
  document.getElementById('modal-title').textContent='Новая идея';
  document.getElementById('edit-id').value='';
  ['f-title','f-desc','f-img','f-addr','f-link'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('f-cat').value='active';
  document.getElementById('add-modal').classList.add('show');
};

window.openEditModal=id=>{
  const d=ideas.find(x=>x.id===id);if(!d)return;
  document.getElementById('modal-title').textContent='Редактировать';
  document.getElementById('edit-id').value=id;
  document.getElementById('f-title').value=d.title||'';
  document.getElementById('f-desc').value=d.desc||'';
  document.getElementById('f-cat').value=d.cat||'active';
  document.getElementById('f-img').value=d.img||'';
  document.getElementById('f-addr').value=d.addr||'';
  document.getElementById('f-link').value=d.link||'';
  document.getElementById('add-modal').classList.add('show');
};

window.closeModal=id=>{document.getElementById(id).classList.remove('show');};

window.saveIdea=async()=>{
  const title=document.getElementById('f-title').value.trim();if(!title)return;
  const editId=document.getElementById('edit-id').value;
  if(editId){
    await patch(editId,{title,desc:document.getElementById('f-desc').value.trim(),cat:document.getElementById('f-cat').value,img:document.getElementById('f-img').value.trim(),addr:document.getElementById('f-addr').value.trim(),link:document.getElementById('f-link').value.trim()});
  } else {
    const newId=String(Date.now());
    await set(ref(db,'ideas/'+newId),{id:newId,title,desc:document.getElementById('f-desc').value.trim(),cat:document.getElementById('f-cat').value,img:document.getElementById('f-img').value.trim(),addr:document.getElementById('f-addr').value.trim(),link:document.getElementById('f-link').value.trim(),lat:55.751,lon:37.618,liked:false,done:false,planned:false,plannedDate:'',date:'',rating:0,review:'',times:0,deleted:false});
  }
  closeModal('add-modal');
};

['add-modal','plan-modal','confirm-modal'].forEach(id=>{
  document.getElementById(id).addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal(id);});
});
</script>
</body>
</html>
