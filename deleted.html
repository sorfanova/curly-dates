<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Удалённые — Кучерявые свидания</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Geologica:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--black:#0f0f0f;--white:#fafaf8;--cream:#f4f1ec;--muted:#999;--border:rgba(15,15,15,.1);--font-display:'Cormorant Garamond',serif;--font-body:'Geologica',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-body);background:var(--white);color:var(--black);min-height:100vh}
.header{padding:24px 16px 20px;max-width:800px;margin:0 auto;display:flex;align-items:center;gap:16px;border-bottom:1px solid var(--border)}
.back{color:var(--black);font-size:22px;opacity:.5;line-height:1;text-decoration:none;flex-shrink:0}
.header-text h1{font-family:var(--font-display);font-size:26px;font-weight:500}
.header-text p{font-size:11px;color:var(--muted);margin-top:3px;font-weight:300;letter-spacing:.03em}
.sync-bar{padding:8px 16px;max-width:800px;margin:0 auto;display:flex;align-items:center;gap:6px;font-size:10px;color:var(--muted)}
.sync-dot{width:5px;height:5px;border-radius:50%;background:#22c55e;flex-shrink:0}
.sync-dot.syncing{background:#f59e0b;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.content{max-width:800px;margin:0 auto;padding:0 16px 40px}
.empty{text-align:center;padding:4rem 1rem;color:var(--muted);font-size:13px;font-weight:300}
.item{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--border);align-items:flex-start}
.item:last-child{border-bottom:none}
.item-thumb{width:56px;height:72px;object-fit:cover;background:var(--cream);flex-shrink:0;opacity:.5;display:block}
.item-thumb-ph{width:56px;height:72px;background:var(--cream);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;opacity:.5}
.item-body{flex:1;min-width:0}
.item-cat{font-size:9px;color:var(--muted);letter-spacing:.07em;text-transform:uppercase;margin-bottom:3px}
.item-title{font-family:var(--font-display);font-size:16px;font-weight:500;color:#aaa;margin-bottom:4px}
.item-desc{font-size:11px;color:#ccc;line-height:1.4;font-weight:300;margin-bottom:10px}
.item-actions{display:flex;gap:8px}
.btn-restore{padding:7px 14px;background:var(--black);color:#fff;border:none;font-family:var(--font-body);font-size:11px;cursor:pointer;letter-spacing:.06em}
.btn-restore:hover{opacity:.8}
.btn-perm{padding:7px 14px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:var(--font-body);font-size:11px;cursor:pointer;letter-spacing:.06em}
.btn-perm:hover{color:#c00;border-color:#c00}
</style>
<script>const _p="memory";if(localStorage.getItem("curly_auth")!==_p){const inp=prompt("Введите пароль:");if(inp===_p){localStorage.setItem("curly_auth",_p);}else{document.body.innerHTML="<div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:Georgia,serif;color:#999;font-size:14px">Неверный пароль</div>";throw new Error("auth");}}</script>
</head>
<body>
<div class="header">
  <a class="back" href="index.html">←</a>
  <div class="header-text">
    <h1>Удалённые идеи</h1>
    <p>Можно восстановить или удалить навсегда</p>
  </div>
</div>
<div class="sync-bar">
  <div class="sync-dot syncing" id="sync-dot"></div>
  <span id="sync-text">Загрузка...</span>
</div>
<div class="content">
  <div id="list"><div class="empty">Загрузка...</div></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
const app=initializeApp({databaseURL:"https://curly-dates-default-rtdb.europe-west1.firebasedatabase.app/"});
const db=getDatabase(app);
const catMeta={active:{label:'Активное',emoji:'🎯'},trip:{label:'Поездка',emoji:'✈️'},food:{label:'Ресторан',emoji:'🍽️'},sport:{label:'Спорт',emoji:'⚡'},culture:{label:'Культура',emoji:'🎭'},spa:{label:'Спа',emoji:'🛁'}};
let ideas=[];
function setSyncStatus(s,t){document.getElementById('sync-dot').className='sync-dot'+(s==='syncing'?' syncing':s==='error'?' error':'');document.getElementById('sync-text').textContent=t;}
onValue(ref(db,'ideas'),snap=>{const data=snap.val();ideas=data?Object.values(data).filter(d=>d.deleted):[];setSyncStatus('ok','Синхронизировано');render();},err=>setSyncStatus('error',err.message));
function render(){
  const el=document.getElementById('list');
  if(!ideas.length){el.innerHTML='<div class="empty">Удалённых идей нет ✨</div>';return;}
  el.innerHTML=ideas.map(d=>{
    const m=catMeta[d.cat]||catMeta.active;
    return`<div class="item">
      ${d.img?`<img class="item-thumb" src="${d.img}" alt="${d.title}" onerror="this.outerHTML='<div class=item-thumb-ph>${m.emoji}</div>'">`:`<div class="item-thumb-ph">${m.emoji}</div>`}
      <div class="item-body">
        <div class="item-cat">${m.label}</div>
        <div class="item-title">${d.title}</div>
        <div class="item-desc">${d.desc||''}</div>
        <div class="item-actions">
          <button class="btn-restore" onclick="restore('${d.id}')">Восстановить</button>
          <button class="btn-perm" onclick="permDelete('${d.id}')">Удалить навсегда</button>
        </div>
      </div>
    </div>`;
  }).join('');
}
window.restore=async id=>{setSyncStatus('syncing','...');await update(ref(db,'ideas/'+id),{deleted:false});};
window.permDelete=async id=>{if(!confirm('Удалить навсегда? Это необратимо.'))return;setSyncStatus('syncing','...');await remove(ref(db,'ideas/'+id));};
</script>
</body>
</html>
