<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Идея — Кучерявые свидания</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Geologica:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--black:#0f0f0f;--white:#fafaf8;--cream:#f4f1ec;--muted:#888;--border:rgba(15,15,15,.1);--font-display:'Cormorant Garamond',serif;--font-body:'Geologica',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-body);background:var(--white);color:var(--black);min-height:100vh}
.hero{position:relative;width:100%;height:55vw;max-height:400px;background:var(--cream);overflow:hidden}
.hero-img{width:100%;height:100%;object-fit:cover;display:block}
.hero-back{position:absolute;top:16px;left:16px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.88);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--black);text-decoration:none;z-index:2}
.hero-like{position:absolute;top:16px;right:16px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.88);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2;font-size:18px;transition:transform .15s}
.hero-like:hover{transform:scale(1.1)}
.hero-emoji{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:80px}
.content{max-width:800px;margin:0 auto;padding:20px 16px 40px}
.idea-cat{font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px;font-weight:400}
.idea-title{font-family:var(--font-display);font-size:28px;font-weight:500;line-height:1.15;margin-bottom:10px;letter-spacing:-.01em}
.idea-desc{font-size:13px;color:#444;line-height:1.7;font-weight:300;margin-bottom:20px}
.divider{height:1px;background:var(--border);margin:20px 0}
.section-label{font-size:10px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px;font-weight:400}
.action-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.btn-action{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border:1px solid var(--border);background:transparent;color:var(--black);font-family:var(--font-body);font-size:12px;cursor:pointer;letter-spacing:.04em;transition:all .2s}
.btn-action:hover{background:var(--cream)}
.btn-action.primary{background:var(--black);color:var(--white);border-color:var(--black)}
.btn-action.primary:hover{opacity:.85}
.btn-action.active-done{background:var(--black);color:var(--white);border-color:var(--black)}
.btn-action.active-like i{color:var(--black)}
.btn-map{border-color:#ccc;color:#555}
.btn-site{border-color:#ccc;color:#555}
.stars-row{display:flex;gap:6px;margin-bottom:16px}
.star{font-size:28px;cursor:pointer;color:#ddd;transition:color .1s;line-height:1;user-select:none}
.star.on{color:var(--black)}
.review-wrap{margin-bottom:20px}
.review-ta{width:100%;font-size:13px;font-family:var(--font-body);padding:12px;border:1px solid var(--border);background:var(--cream);color:var(--black);resize:none;height:80px;outline:none;font-weight:300;transition:border-color .2s}
.review-ta:focus{border-color:var(--black)}
.review-saved{font-size:12px;color:var(--muted);font-style:italic;font-weight:300;margin-top:6px;line-height:1.5}
.date-wrap{display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.date-wrap label{font-size:11px;color:var(--muted)}
.date-input{font-size:12px;font-family:var(--font-body);padding:8px 10px;border:1px solid var(--border);background:var(--cream);color:var(--black);outline:none;-webkit-appearance:none}
.date-input:focus{border-color:var(--black)}
.repeat-badge{font-size:11px;color:var(--muted);padding:4px 10px;border:1px solid var(--border)}
.addr-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-bottom:8px;font-weight:300}
.addr-row i{font-size:14px}
.edit-section{margin-top:20px}
.edit-toggle{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);cursor:pointer;letter-spacing:.04em;background:none;border:none;font-family:var(--font-body);padding:0}
.edit-toggle:hover{color:var(--black)}
.edit-form{display:none;margin-top:16px;border-top:1px solid var(--border);padding-top:16px}
.form-row{margin-bottom:12px}
.form-row label{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.form-row input,.form-row textarea,.form-row select{width:100%;font-size:13px;font-family:var(--font-body);padding:10px 12px;border:1px solid var(--border);background:var(--cream);color:var(--black);outline:none;-webkit-appearance:none}
.form-row input:focus,.form-row textarea:focus,.form-row select:focus{border-color:var(--black)}
.form-row textarea{height:60px;resize:none}
.del-btn{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);cursor:pointer;letter-spacing:.04em;background:none;border:none;font-family:var(--font-body);padding:0;margin-top:16px}
.del-btn:hover{color:#c00}
.sync-bar{position:fixed;bottom:16px;right:16px;display:flex;align-items:center;gap:6px;font-size:10px;color:var(--muted);background:rgba(250,250,248,.9);padding:6px 10px;border:1px solid var(--border)}
.sync-dot{width:5px;height:5px;border-radius:50%;background:#22c55e;flex-shrink:0}
.sync-dot.syncing{background:#f59e0b;animation:pulse 1s infinite}
.sync-dot.error{background:#ef4444}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:none;align-items:flex-end;justify-content:center}
.confirm-overlay.show{display:flex}
.confirm-box{background:var(--white);width:100%;max-width:400px;padding:24px 20px}
.confirm-box p{font-size:14px;font-weight:300;line-height:1.5;margin-bottom:20px}
.confirm-btns{display:flex;gap:8px}
.btn-del-confirm{flex:1;padding:11px;background:var(--black);color:var(--white);border:none;font-family:var(--font-body);font-size:12px;cursor:pointer;letter-spacing:.06em}
.btn-del-cancel{flex:1;padding:11px;border:1px solid var(--border);background:transparent;font-family:var(--font-body);font-size:12px;cursor:pointer;color:var(--muted)}
</style>
</head>
<body>
<div class="hero" id="hero">
  <a class="hero-back" href="index.html">&#8592;</a>
  <button class="hero-like" id="like-btn" onclick="toggleLike()"><i class="ti ti-heart" id="like-icon" aria-hidden="true"></i></button>
  <div class="hero-emoji" id="hero-emoji"></div>
</div>

<div class="content" id="content">
  <div style="text-align:center;padding:3rem;color:#888;font-size:13px">Загрузка...</div>
</div>

<div class="sync-bar">
  <div class="sync-dot syncing" id="sync-dot"></div>
  <span id="sync-text">...</span>
</div>

<div class="confirm-overlay" id="confirm-overlay">
  <div class="confirm-box">
    <p>Удалить эту идею? Она попадёт в список удалённых.</p>
    <div class="confirm-btns">
      <button class="btn-del-confirm" onclick="confirmDelete()">Удалить</button>
      <button class="btn-del-cancel" onclick="document.getElementById('confirm-overlay').classList.remove('show')">Отмена</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const app = initializeApp({ databaseURL: "https://curly-dates-default-rtdb.europe-west1.firebasedatabase.app/" });
const db = getDatabase(app);
const id = new URLSearchParams(window.location.search).get('id');

const catMeta = {
  active:{label:'Активное',emoji:'🎯'}, trip:{label:'Поездка',emoji:'✈️'},
  food:{label:'Ресторан',emoji:'🍽️'}, sport:{label:'Спорт',emoji:'⚡'},
  culture:{label:'Культура',emoji:'🎭'}, spa:{label:'Спа',emoji:'🛁'},
};

let idea = null;

function setSyncStatus(s, t) {
  document.getElementById('sync-dot').className = 'sync-dot'+(s==='syncing'?' syncing':s==='error'?' error':'');
  document.getElementById('sync-text').textContent = t;
}

async function patch(data) {
  setSyncStatus('syncing','Сохраняем...');
  await update(ref(db,'ideas/'+id), data);
  setSyncStatus('ok','Сохранено');
}

onValue(ref(db,'ideas/'+id), snap => {
  idea = snap.val();
  if (!idea) { document.getElementById('content').innerHTML='<div style="text-align:center;padding:3rem;color:#888">Идея не найдена</div>'; return; }
  setSyncStatus('ok','Синхронизировано');
  renderPage();
}, err => setSyncStatus('error', err.message));

function renderPage() {
  if (!idea) return;
  const m = catMeta[idea.cat]||catMeta.active;

  // Hero
  const hero = document.getElementById('hero');
  const existImg = hero.querySelector('.hero-real-img');
  if (existImg) existImg.remove();
  if (idea.img) {
    const img = document.createElement('img');
    img.className = 'hero-img hero-real-img';
    img.src = idea.img;
    img.alt = idea.title;
    img.onerror = () => img.remove();
    hero.insertBefore(img, hero.querySelector('.hero-back'));
  }
  document.getElementById('hero-emoji').textContent = m.emoji;

  // Like btn
  const likeIcon = document.getElementById('like-icon');
  likeIcon.className = idea.liked ? 'ti ti-heart-filled' : 'ti ti-heart';

  const stars = [1,2,3,4,5].map(n =>
    `<span class="star ${n<=(idea.rating||0)?'on':''}" onclick="setRating(${n})">★</span>`
  ).join('');

  const ymap = idea.addr ? `https://yandex.ru/maps/?text=${encodeURIComponent(idea.addr)}` : '';
  const dateStr = idea.date ? new Date(idea.date).toLocaleDateString('ru',{day:'numeric',month:'long',year:'numeric'}) : '';

  document.getElementById('content').innerHTML = `
    <div class="idea-cat">${m.label}</div>
    <div class="idea-title">${idea.title}</div>
    <div class="idea-desc">${idea.desc||''}</div>

    ${idea.addr ? `<div class="addr-row"><i class="ti ti-map-pin" aria-hidden="true"></i>${idea.addr}</div>` : ''}

    <div class="action-row">
      <button class="btn-action ${idea.done?'active-done primary':''}" onclick="toggleDone()">
        <i class="ti ti-check" aria-hidden="true"></i>${idea.done?'Были':'Отметить как были'}
      </button>
      ${idea.done ? `<button class="btn-action" onclick="doRepeat()"><i class="ti ti-refresh" aria-hidden="true"></i>Повторить${(idea.times||0)>1?' ×'+idea.times:''}</button>` : ''}
      ${ymap ? `<a class="btn-action btn-map" href="${ymap}" target="_blank"><i class="ti ti-map-pin" aria-hidden="true"></i>На карте</a>` : ''}
      ${idea.link ? `<a class="btn-action btn-site" href="${idea.link}" target="_blank"><i class="ti ti-external-link" aria-hidden="true"></i>Сайт</a>` : ''}
    </div>

    ${idea.done ? `
    <div class="divider"></div>
    <div class="section-label">Оценка</div>
    <div class="stars-row">${stars}</div>

    <div class="section-label">Отзыв</div>
    <div class="review-wrap">
      <textarea class="review-ta" id="review-ta" placeholder="Как вам понравилось?">${idea.review||''}</textarea>
      <button onclick="saveReview()" style="margin-top:8px;padding:8px 16px;background:var(--black);color:#fff;border:none;font-family:var(--font-body);font-size:11px;letter-spacing:.06em;cursor:pointer">Сохранить</button>
      ${idea.review ? `<div class="review-saved">"${idea.review}"</div>` : ''}
    </div>

    <div class="section-label">Дата свидания</div>
    <div class="date-wrap">
      <input class="date-input" type="date" id="date-input" value="${idea.date||''}" onchange="saveDate(this.value)">
      ${dateStr ? `<span style="font-size:12px;color:var(--muted)">${dateStr}</span>` : ''}
      ${(idea.times||0)>1 ? `<span class="repeat-badge">Повторяли ×${idea.times}</span>` : ''}
    </div>` : ''}

    <div class="divider"></div>
    <div class="edit-section">
      <button class="edit-toggle" onclick="toggleEdit()"><i class="ti ti-pencil" style="font-size:13px" aria-hidden="true"></i> Редактировать</button>
      <div class="edit-form" id="edit-form">
        <div class="form-row"><label>Название</label><input type="text" id="e-title" value="${idea.title||''}"></div>
        <div class="form-row"><label>Описание</label><textarea id="e-desc">${idea.desc||''}</textarea></div>
        <div class="form-row"><label>Категория</label>
          <select id="e-cat">
            <option value="active" ${idea.cat==='active'?'selected':''}>Активное</option>
            <option value="trip" ${idea.cat==='trip'?'selected':''}>Поездка</option>
            <option value="food" ${idea.cat==='food'?'selected':''}>Ресторан</option>
            <option value="sport" ${idea.cat==='sport'?'selected':''}>Спорт</option>
            <option value="culture" ${idea.cat==='culture'?'selected':''}>Культура</option>
            <option value="spa" ${idea.cat==='spa'?'selected':''}>Спа / Релакс</option>
          </select>
        </div>
        <div class="form-row"><label>Фото (URL)</label><input type="text" id="e-img" value="${idea.img||''}"></div>
        <div class="form-row"><label>Адрес</label><input type="text" id="e-addr" value="${idea.addr||''}"></div>
        <div class="form-row"><label>Сайт</label><input type="text" id="e-link" value="${idea.link||''}"></div>
        <button onclick="saveEdit()" style="padding:10px 20px;background:var(--black);color:#fff;border:none;font-family:var(--font-body);font-size:12px;letter-spacing:.06em;cursor:pointer">Сохранить</button>
      </div>
      <button class="del-btn" onclick="document.getElementById('confirm-overlay').classList.add('show')">
        <i class="ti ti-trash" style="font-size:13px" aria-hidden="true"></i> Удалить идею
      </button>
    </div>
  `;
}

window.toggleLike = async () => {
  if(!idea) return;
  await patch({liked:!idea.liked});
};
window.toggleDone = async () => {
  if(!idea) return;
  const newDone = !idea.done;
  await patch({done:newDone, times:newDone?(idea.times||0)+1:Math.max(0,(idea.times||1)-1)});
};
window.doRepeat = async () => {
  if(!idea) return;
  await patch({times:(idea.times||1)+1});
};
window.setRating = async r => { if(idea) await patch({rating:r}); };
window.saveReview = async () => {
  const ta = document.getElementById('review-ta');
  if(ta && idea) await patch({review:ta.value});
};
window.saveDate = async val => { if(idea) await patch({date:val}); };
window.toggleEdit = () => {
  const f = document.getElementById('edit-form');
  if(f) f.style.display = f.style.display==='block'?'none':'block';
};
window.saveEdit = async () => {
  await patch({
    title: document.getElementById('e-title').value.trim(),
    desc: document.getElementById('e-desc').value.trim(),
    cat: document.getElementById('e-cat').value,
    img: document.getElementById('e-img').value.trim(),
    addr: document.getElementById('e-addr').value.trim(),
    link: document.getElementById('e-link').value.trim(),
  });
  toggleEdit();
};
window.confirmDelete = async () => {
  await patch({deleted:true});
  window.location.href = 'index.html';
};
</script>
</body>
</html>
