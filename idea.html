<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Идея — Кучерявые свидания</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Geologica:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--black:#0f0f0f;--white:#fafaf8;--cream:#f4f1ec;--muted:#999;--border:rgba(15,15,15,.1);--font-display:'Cormorant Garamond',serif;--font-body:'Geologica',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-body);background:var(--white);color:var(--black);min-height:100vh}
.hero{position:relative;width:100%;height:55vw;max-height:420px;background:var(--cream);overflow:hidden}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
/* эмодзи только как fallback — скрыт если фото есть */
.hero-emoji{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:80px;z-index:0}
.hero img+.hero-emoji{display:none}
.hero-back{position:absolute;top:16px;left:16px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.88);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--black);text-decoration:none;z-index:2}
.hero-like{position:absolute;top:16px;right:16px;z-index:2;background:none;border:none;padding:0;cursor:pointer;filter:drop-shadow(0 1px 4px rgba(0,0,0,.4))}
.content{max-width:800px;margin:0 auto;padding:20px 16px 48px}
.idea-cat{font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
.idea-title{font-family:var(--font-display);font-size:32px;font-weight:500;line-height:1.15;margin-bottom:10px}
.idea-desc{font-size:13px;color:#444;line-height:1.7;font-weight:300;margin-bottom:16px}
.idea-addr{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);margin-bottom:8px;font-weight:300}
.idea-addr svg{width:13px;height:13px;stroke:currentColor;stroke-width:1.8;fill:none;flex-shrink:0}
.idea-link{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--black);border-bottom:1px solid rgba(0,0,0,.2);padding-bottom:1px;letter-spacing:.04em;text-decoration:none;margin-bottom:16px}
.idea-link svg{width:12px;height:12px;stroke:currentColor;stroke-width:1.8;fill:none}
.divider{height:1px;background:var(--border);margin:20px 0}
.section-label{font-size:10px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px}
/* ПЛАН / БЫЛИ */
.action-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.btn-action{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border:1px solid var(--border);background:transparent;color:var(--black);font-family:var(--font-body);font-size:12px;cursor:pointer;letter-spacing:.04em;transition:all .2s;text-decoration:none}
.btn-action:hover{background:var(--cream)}
.btn-action.primary{background:var(--black);color:var(--white);border-color:var(--black)}
.btn-action.primary:hover{opacity:.85}
.btn-action svg{width:14px;height:14px;stroke:currentColor;stroke-width:1.8;fill:none;flex-shrink:0}
/* Запланировано блок */
.planned-block{margin-bottom:16px}
.planned-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.planned-date-text{font-size:13px;color:var(--black);font-weight:300}
.btn-cancel-plan{font-size:11px;color:var(--muted);background:none;border:none;border-bottom:1px solid rgba(0,0,0,.2);cursor:pointer;font-family:var(--font-body);padding:0;letter-spacing:.04em}
.plan-date-edit{font-size:13px;font-family:var(--font-body);padding:8px 10px;border:1px solid var(--border);background:var(--cream);color:var(--black);outline:none;-webkit-appearance:none;width:100%;max-width:200px}
/* КАРТА */
.map-wrap{margin-bottom:20px}
.map-frame{width:100%;height:200px;border:none;display:block;background:#e8e4de}
/* ОЦЕНКА */
.stars-row{display:flex;gap:8px;margin-bottom:16px}
.star{font-size:28px;cursor:pointer;color:#e0ddd8;transition:color .1s;line-height:1;user-select:none}
.star.on{color:#FDD663}
.review-ta{width:100%;font-size:13px;font-family:var(--font-body);padding:12px;border:1px solid var(--border);background:var(--cream);color:var(--black);resize:none;height:80px;outline:none;font-weight:300}
.review-ta:focus{border-color:var(--black)}
.btn-small{padding:8px 16px;background:var(--black);color:#fff;border:none;font-family:var(--font-body);font-size:11px;letter-spacing:.06em;cursor:pointer;margin-top:8px;display:block}
.date-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.date-label{font-size:11px;color:var(--muted)}
.date-input{font-size:12px;font-family:var(--font-body);padding:8px 10px;border:1px solid var(--border);background:var(--cream);color:var(--black);outline:none;-webkit-appearance:none}
.date-input:focus{border-color:var(--black)}
.dates-list{font-size:11px;color:var(--muted);margin-top:4px;font-weight:300}
/* РЕДАКТИРОВАТЬ */
.edit-toggle{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);cursor:pointer;letter-spacing:.04em;background:none;border:none;font-family:var(--font-body);padding:0;margin-bottom:12px}
.edit-toggle:hover{color:var(--black)}
.edit-toggle svg{width:13px;height:13px;stroke:currentColor;stroke-width:1.8;fill:none}
.edit-form{display:none;border-top:1px solid var(--border);padding-top:16px;margin-bottom:16px}
.form-row{margin-bottom:12px}
.form-row label{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.form-row input,.form-row textarea,.form-row select{width:100%;font-size:13px;font-family:var(--font-body);padding:10px 12px;border:1px solid var(--border);background:var(--cream);color:var(--black);outline:none;-webkit-appearance:none}
.form-row input:focus,.form-row textarea:focus,.form-row select:focus{border-color:var(--black)}
.form-row textarea{height:60px;resize:none}
.del-btn{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);cursor:pointer;letter-spacing:.04em;background:none;border:none;font-family:var(--font-body);padding:0;margin-top:12px}
.del-btn:hover{color:#c00}
.del-btn svg{width:13px;height:13px;stroke:currentColor;stroke-width:1.8;fill:none}
.sync-bar{position:fixed;bottom:16px;right:16px;display:flex;align-items:center;gap:6px;font-size:10px;color:var(--muted);background:rgba(250,250,248,.92);padding:6px 10px;border:1px solid var(--border)}
.sync-dot{width:5px;height:5px;border-radius:50%;background:#22c55e;flex-shrink:0}
.sync-dot.syncing{background:#f59e0b;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:none;align-items:flex-end;justify-content:center}
.confirm-overlay.show{display:flex}
.confirm-box{background:var(--white);width:100%;max-width:400px;padding:28px 20px}
.confirm-box p{font-size:14px;font-weight:300;line-height:1.5;margin-bottom:22px}
.confirm-btns{display:flex;gap:8px}
.btn-del-confirm{flex:1;padding:11px;background:var(--black);color:#fff;border:none;font-family:var(--font-body);font-size:12px;cursor:pointer;letter-spacing:.06em}
.btn-del-cancel{flex:1;padding:11px;border:1px solid var(--border);background:transparent;font-family:var(--font-body);font-size:12px;cursor:pointer;color:var(--muted)}
.plan-modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:flex-end;justify-content:center}
.plan-modal-bg.show{display:flex}
.plan-modal{background:var(--white);width:100%;max-width:360px;padding:28px 20px;margin:16px}
.plan-modal h3{font-family:var(--font-display);font-size:20px;font-weight:500;margin-bottom:6px}
.plan-modal p{font-size:12px;color:var(--muted);margin-bottom:20px;font-weight:300;line-height:1.5}
.plan-date-input{width:100%;font-size:13px;font-family:var(--font-body);padding:10px 12px;border:1px solid var(--border);background:var(--cream);color:var(--black);outline:none;margin-bottom:10px;display:none;-webkit-appearance:none}
.plan-btns{display:flex;flex-direction:column;gap:8px}
.btn-plan-confirm{padding:11px;background:var(--black);color:#fff;border:none;font-family:var(--font-body);font-size:12px;cursor:pointer;letter-spacing:.06em;text-align:left}
.btn-plan-later{padding:11px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:var(--font-body);font-size:12px;cursor:pointer;letter-spacing:.06em;text-align:left}
.btn-cancel-form{padding:11px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:var(--font-body);font-size:12px;cursor:pointer}
@media(min-width:600px){.plan-modal-bg{align-items:center}}
</style>
</head>
<body>
<div class="hero" id="hero">
  <a class="hero-back" href="index.html">←</a>
  <div class="hero-like" id="like-btn" onclick="toggleLike()">
    <svg id="like-svg" width="26" height="26" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>
  <div class="hero-emoji" id="hero-emoji"></div>
</div>
<div class="content" id="content"><div style="text-align:center;padding:3rem;color:#999;font-size:13px">Загрузка...</div></div>
<div class="sync-bar"><div class="sync-dot syncing" id="sync-dot"></div><span id="sync-text">...</span></div>
<div class="confirm-overlay" id="confirm-overlay">
  <div class="confirm-box">
    <p>Удалить эту идею? Она попадёт в список удалённых.</p>
    <div class="confirm-btns">
      <button class="btn-del-confirm" onclick="confirmDelete()">Удалить</button>
      <button class="btn-del-cancel" onclick="document.getElementById('confirm-overlay').classList.remove('show')">Отмена</button>
    </div>
  </div>
</div>
<div class="plan-modal-bg" id="plan-modal-bg">
  <div class="plan-modal">
    <h3>Запланировать</h3>
    <p>Выберите дату или добавьте в план — определитесь позже</p>
    <input type="date" class="plan-date-input" id="plan-date-input">
    <div class="plan-btns">
      <button class="btn-plan-confirm" onclick="togglePlanDate()">📅 Выбрать дату</button>
      <button class="btn-plan-later" onclick="planWithoutDate()">Добавить в план, дату выберем позже</button>
      <button class="btn-cancel-form" onclick="closePlanModal()" style="margin-top:4px">Отмена</button>
    </div>
  </div>
</div>

<script src="https://api-maps.yandex.ru/2.1/?apikey=3721b472-c7ca-4adf-824d-50a59f74f1d3&lang=ru_RU"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
const app=initializeApp({databaseURL:"https://curly-dates-default-rtdb.europe-west1.firebasedatabase.app/"});
const db=getDatabase(app);
const id=new URLSearchParams(window.location.search).get('id');
const catMeta={active:{label:'Активное',emoji:'🎯'},trip:{label:'Поездка',emoji:'✈️'},food:{label:'Ресторан',emoji:'🍽️'},sport:{label:'Спорт',emoji:'⚡'},culture:{label:'Культура',emoji:'🎭'},spa:{label:'Спа',emoji:'🛁'}};
let idea=null, ymap=null, geocoded=false;

function setSyncStatus(s,t){document.getElementById('sync-dot').className='sync-dot'+(s==='syncing'?' syncing':s==='error'?' error':'');document.getElementById('sync-text').textContent=t;}
function parseDate(str){if(!str)return null;const[y,m,d]=str.split('-');return new Date(+y,+m-1,+d);}
function formatDate(str,opts){const d=parseDate(str);return d?d.toLocaleDateString('ru',opts):'';}

async function patch(data){setSyncStatus('syncing','Сохраняем...');await update(ref(db,'ideas/'+id),data);setSyncStatus('ok','Сохранено');}

onValue(ref(db,'ideas/'+id),snap=>{
  idea=snap.val();
  if(!idea){document.getElementById('content').innerHTML='<div style="text-align:center;padding:3rem;color:#999">Идея не найдена</div>';return;}
  setSyncStatus('ok','Синхронизировано');
  renderPage();
  initMap();
},err=>setSyncStatus('error',err.message));

function initMap(){
  if(!idea||ymap)return;
  ymaps.ready(async()=>{
    // Геокодируем если нет координат
    let lat=idea.lat, lon=idea.lon;
    if((!lat||!lon)&&idea.addr&&!geocoded){
      geocoded=true;
      try{
        const res=await ymaps.geocode(idea.addr,{results:1});
        const obj=res.geoObjects.get(0);
        if(obj){const c=obj.geometry.getCoordinates();lat=c[0];lon=c[1];await patch({lat,lon});}
      }catch(e){}
    }
    if(!lat||!lon)return;
    const mapEl=document.getElementById('idea-map');
    if(!mapEl)return;
    ymap=new ymaps.Map(mapEl,{center:[lat,lon],zoom:14,controls:['zoomControl']},{suppressMapOpenBlock:true});
    const pm=new ymaps.Placemark([lat,lon],{hintContent:idea.title},{preset:'islands#circleDotIcon',iconColor:'#0f0f0f'});
    ymap.geoObjects.add(pm);
  });
}

function renderPage(){
  if(!idea)return;
  const m=catMeta[idea.cat]||catMeta.active;
  // Hero
  const hero=document.getElementById('hero');
  hero.querySelectorAll('.hero-real-img').forEach(e=>e.remove());
  document.getElementById('hero-emoji').textContent=m.emoji;
  if(idea.img){
    const img=document.createElement('img');
    img.className='hero-real-img';
    img.src=idea.img;
    img.alt=idea.title;
    img.onload=()=>{const e=document.getElementById('hero-emoji');if(e)e.style.display='none';};img.onerror=()=>img.remove();
    // insert before back button
    hero.insertBefore(img,hero.querySelector('.hero-back'));
  }
  // Like
  const path=document.getElementById('like-svg').querySelector('path');
  if(idea.liked){path.setAttribute('fill','#e8304a');path.setAttribute('stroke','#e8304a');}
  else{path.setAttribute('fill','none');path.setAttribute('stroke','#fff');}

  const ymap_url=idea.addr?`https://yandex.ru/maps/?text=${encodeURIComponent(idea.addr)}`:'';
  const stars=[1,2,3,4,5].map(n=>`<span class="star ${n<=(idea.rating||0)?'on':''}" onclick="setRating(${n})">★</span>`).join('');
  const dates=idea.dates||[];
  const times=dates.length;
  const dateStr=idea.date?formatDate(idea.date,{day:'numeric',month:'long',year:'numeric'}):'';
  const plannedDateStr=idea.plannedDate?formatDate(idea.plannedDate,{day:'numeric',month:'long',year:'numeric'}):'Без даты';

  // Блок планирования / были
  let planBlock='';
  if(idea.planned){
    planBlock=`
      <div class="planned-block">
        <div class="section-label">Запланировано</div>
        <div class="planned-row">
          <span class="planned-date-text">📅 ${plannedDateStr}</span>
          <button class="btn-cancel-plan" onclick="cancelPlan()">отменить</button>
        </div>
        <input type="date" class="plan-date-edit" id="plan-date-edit" value="${idea.plannedDate||''}" onchange="savePlannedDate(this.value)" placeholder="Изменить дату">
        <div style="margin-top:8px">
          <button class="btn-action primary" onclick="markDone()">
            <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
            Отметить как были
          </button>
        </div>
      </div>`;
  } else if(idea.done&&!idea.repeat){
    planBlock=`
      <div class="action-row">
        <button class="btn-action" onclick="doRepeat()">↩ Повторить</button>
        ${ymap_url?`<a class="btn-action" href="${ymap_url}" target="_blank"><svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>На карте</a>`:''}
        ${idea.link?`<a class="btn-action" href="${idea.link}" target="_blank"><svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>Сайт</a>`:''}
      </div>`;
  } else {
    planBlock=`
      <div class="action-row">
        <button class="btn-action primary" onclick="markDone()">
          <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
          Отметить как были
        </button>
        <button class="btn-action" onclick="openPlanModal()">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          Запланировать
        </button>
        ${ymap_url?`<a class="btn-action" href="${ymap_url}" target="_blank"><svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>На карте</a>`:''}
        ${idea.link?`<a class="btn-action" href="${idea.link}" target="_blank"><svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>Сайт</a>`:''}
      </div>`;
  }

  document.getElementById('content').innerHTML=`
    <div class="idea-cat">${m.label}</div>
    <div class="idea-title">${idea.title}</div>
    ${idea.desc?`<div class="idea-desc">${idea.desc}</div>`:''}
    ${idea.addr?`<div class="idea-addr"><svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>${idea.addr}</div>`:''}
    ${idea.link?`<a class="idea-link" href="${idea.link}" target="_blank"><svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>Открыть сайт</a>`:''}

    <div class="divider"></div>
    ${planBlock}

    ${(idea.lat&&idea.lon)||idea.addr?`
    <div class="map-wrap">
      <div class="section-label">На карте</div>
      <div class="map-frame" id="idea-map"></div>
    </div>`:''}

    ${idea.done?`
    <div class="divider"></div>
    <div class="section-label">Оценка</div>
    <div class="stars-row">${stars}</div>
    <div class="section-label">Отзыв</div>
    <textarea class="review-ta" id="review-ta" placeholder="Как вам понравилось?">${idea.review||''}</textarea>
    <button class="btn-small" onclick="saveReview()">Сохранить отзыв</button>
    <div class="divider"></div>
    <div class="section-label">Дата свидания</div>
    <div class="date-row">
      <span class="date-label">📅</span>
      <input class="date-input" type="date" id="date-input" value="${idea.date||''}" onchange="saveDate(this.value)">
      ${dateStr?`<span style="font-size:12px;color:var(--muted)">${dateStr}</span>`:''}
    </div>
    ${dates.length>0?`<div class="dates-list">${dates.map(d=>formatDate(d,{day:'numeric',month:'long',year:'numeric'})).join(' · ')}</div>`:''}
    `:''}

    <div class="divider"></div>
    <button class="edit-toggle" onclick="toggleEdit()">
      <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      Редактировать
    </button>
    <div class="edit-form" id="edit-form">
      <div class="form-row"><label>Название</label><input type="text" id="e-title" value="${idea.title||''}"></div>
      <div class="form-row"><label>Описание</label><textarea id="e-desc">${idea.desc||''}</textarea></div>
      <div class="form-row"><label>Категория</label>
        <select id="e-cat">
          <option value="active" ${idea.cat==='active'?'selected':''}>Активное</option>
          <option value="trip" ${idea.cat==='trip'?'selected':''}>Поездка</option>
          <option value="food" ${idea.cat==='food'?'selected':''}>Ресторан</option>
          <option value="sport" ${idea.cat==='sport'?'selected':''}>Спорт</option>
          <option value="culture" ${idea.cat==='culture'?'selected':''}>Культура</option>
          <option value="spa" ${idea.cat==='spa'?'selected':''}>Спа</option>
        </select>
      </div>
      <div class="form-row"><label>Фото (URL)</label><input type="text" id="e-img" value="${idea.img||''}"></div>
      <div class="form-row"><label>Адрес</label><input type="text" id="e-addr" value="${idea.addr||''}"></div>
      <div class="form-row"><label>Сайт</label><input type="text" id="e-link" value="${idea.link||''}"></div>
      <button class="btn-small" onclick="saveEdit()">Сохранить изменения</button>
    </div>
    <button class="del-btn" onclick="document.getElementById('confirm-overlay').classList.add('show')">
      <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M9 6V4h6v2"/></svg>
      Удалить идею
    </button>
  `;
  // reinit map after render
  setTimeout(initMap, 100);
}

window.toggleLike=async()=>{if(idea)await patch({liked:!idea.liked});};

window.markDone=async()=>{
  if(!idea)return;
  const today=new Date();
  const dateStr=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
  const dates=idea.dates||[];
  if(!dates.includes(dateStr))dates.push(dateStr);
  await patch({done:true,planned:false,plannedDate:'',repeat:false,date:dateStr,dates});
};

window.cancelPlan=async()=>{await patch({planned:false,plannedDate:'',repeat:false});};window.doRepeat=async()=>{await patch({repeat:true});};
window.savePlannedDate=async val=>{await patch({plannedDate:val});};

window.openPlanModal=()=>{
  document.getElementById('plan-date-input').value='';
  document.getElementById('plan-date-input').style.display='none';
  document.getElementById('plan-modal-bg').classList.add('show');
};
window.closePlanModal=()=>document.getElementById('plan-modal-bg').classList.remove('show');
window.togglePlanDate=()=>{
  const inp=document.getElementById('plan-date-input');
  inp.style.display=inp.style.display==='none'?'block':'none';
  if(inp.style.display==='block'){inp.focus();inp.onchange=async()=>{await patch({planned:true,plannedDate:inp.value,repeat:true});closePlanModal();};}
};
window.planWithoutDate=async()=>{await patch({planned:true,plannedDate:'',repeat:true});closePlanModal();};

window.setRating=async r=>{if(idea)await patch({rating:r});};
window.saveReview=async()=>{const ta=document.getElementById('review-ta');if(ta&&idea)await patch({review:ta.value});};
window.saveDate=async val=>{
  if(!idea)return;
  const dates=idea.dates||[];
  if(val&&!dates.includes(val))dates.push(val);
  await patch({date:val,dates});
};
window.toggleEdit=()=>{const f=document.getElementById('edit-form');if(f)f.style.display=f.style.display==='block'?'none':'block';};
window.saveEdit=async()=>{
  await patch({
    title:document.getElementById('e-title').value.trim(),
    desc:document.getElementById('e-desc').value.trim(),
    cat:document.getElementById('e-cat').value,
    img:document.getElementById('e-img').value.trim(),
    addr:document.getElementById('e-addr').value.trim(),
    link:document.getElementById('e-link').value.trim(),
  });
  toggleEdit();
};
window.confirmDelete=async()=>{await patch({deleted:true});window.location.href='index.html';};
document.getElementById('plan-modal-bg').addEventListener('click',e=>{if(e.target===e.currentTarget)closePlanModal();});
document.getElementById('confirm-overlay').addEventListener('click',e=>{if(e.target===e.currentTarget)e.currentTarget.classList.remove('show');});
</script>
</body>
</html>
